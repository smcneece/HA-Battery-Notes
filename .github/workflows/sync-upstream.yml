name: Sync from upstream

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork from upstream
        run: gh repo sync smcneece/HA-Battery-Notes --source andrew-codechimp/HA-Battery-Notes --branch main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
